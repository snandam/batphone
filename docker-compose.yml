services:
  postgres:
    image: postgres:16-alpine
    container_name: app-db
    restart: unless-stopped
    env_file: .env
    ports:
      # Change to 5433:5432 if port 5432 is already in use locally
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    container_name: app-migrations
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      # NEXT_PUBLIC_* values are baked into the JS bundle at build time, so
      # they must be build args. All other env vars are provided at runtime
      # via env_file. The Dockerfile has no default for NEXT_PUBLIC_APP_URL;
      # compose interpolates it from .env.
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-}
        NEXT_PUBLIC_BAT_PHONE_NUMBER: ${NEXT_PUBLIC_BAT_PHONE_NUMBER:-}
    container_name: app
    restart: unless-stopped
    ports:
      # Keep port 3000 consistent with the Google OAuth redirect URI
      - "3000:3000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

volumes:
  postgres_data:
